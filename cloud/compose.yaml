name: reading-stack
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg18}
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookorbit
      POSTGRES_DB: bookorbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run prepare.py}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U bookorbit -d bookorbit']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
  bookorbit:
    image: ${BOOKORBIT_IMAGE:-ghcr.io/bookorbit/bookorbit:latest}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: bookorbit
      POSTGRES_DB: bookorbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PODCAST_ENCRYPTION_KEY: ${PODCAST_ENCRYPTION_KEY}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY}
      BOOK_REQUEST_ENCRYPTION_KEY: ${BOOK_REQUEST_ENCRYPTION_KEY}
      MIGRATION_ENCRYPTION_KEY: ${MIGRATION_ENCRYPTION_KEY}
      SETUP_BOOTSTRAP_TOKEN: ${SETUP_BOOTSTRAP_TOKEN}
      APP_URL: https://${BOOKS_DOMAIN}
      BOOK_DOCK_PATH: /dock
      LIBRARY_BROWSE_ROOT: /books
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ:-UTC}
    volumes:
      - ./storage/library:/books
      - ./storage/dock:/dock
      - ./storage/bookorbit:/data
    logging: *logging
  audiobookshelf:
    image: ${ABS_IMAGE:-ghcr.io/advplyr/audiobookshelf:latest}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./storage/library/books:/audiobooks:ro
      - ./storage/podcasts:/podcasts
      - ./storage/audiobookshelf/config:/config
      - ./storage/audiobookshelf/metadata:/metadata
    logging: *logging
  bookbridge:
    image: ${BOOKBRIDGE_IMAGE:-ghcr.io/cporcellijr/bookbridge:latest}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      BOOKBRIDGE_SECRET_KEY: ${BOOKBRIDGE_SECRET_KEY}
      HF_HOME: /data/huggingface
      XDG_CACHE_HOME: /data/cache
    volumes:
      - ./storage/bookbridge:/data
      - ./storage/library/books:/books:ro
    logging: *logging
  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      BOOKS_DOMAIN: ${BOOKS_DOMAIN:?Run prepare.py}
      AUDIO_DOMAIN: ${AUDIO_DOMAIN:?Run prepare.py}
      BRIDGE_DOMAIN: ${BRIDGE_DOMAIN:?Run prepare.py}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Run prepare.py}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging
volumes:
  postgres:
  caddy-data:
  caddy-config:
